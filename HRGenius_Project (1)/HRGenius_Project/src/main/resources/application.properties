spring.application.name=HRGenius
server.port=${PORT:8081}

# Database Configuration (Defaults to embedded H2 for instant out-of-the-box execution)
spring.datasource.url=${DB_URL:jdbc:h2:mem:hrgenius;MODE=MySQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER,MONTH,YEAR}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jackson.serialization.write-dates-as-timestamps=false

# JWT Configuration
app.jwt.secret=${JWT_SECRET:change-this-development-secret-key-to-at-least-32-bytes}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
